sonar.organization=noxone23
sonar.projectKey=noxone23_sd-recap-project-6

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/setupTests.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
